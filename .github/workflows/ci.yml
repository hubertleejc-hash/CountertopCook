name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Look for iPhone Duo / fold APIs and simulators
        run: |
          mkdir -p ci-output
          ci/probe-sdk.sh | tee ci-output/probe.txt

      - name: Core logic tests (fractions, scaling, converter, timers)
        run: swift test --package-path CookCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app and run UI tests on simulators
        run: ci/run-ui-tests.sh

      # Publishes screenshots and test summaries to the `ci-results` branch so they can be
      # viewed without signing in (Actions artifacts and logs require a GitHub login).
      - name: Publish screenshots and summaries to ci-results branch
        if: always()
        run: |
          rm -rf /tmp/results && mkdir -p /tmp/results
          cp -R ci-output/screenshots /tmp/results/ 2>/dev/null || true
          cp ci-output/*.txt /tmp/results/ 2>/dev/null || true
          for f in ci-output/test-*.log ci-output/build.log; do
            [ -f "$f" ] && tail -n 400 "$f" > "/tmp/results/$(basename "$f")"
          done
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > /tmp/results/COMMIT.txt
          cd /tmp/results
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ci-output
          retention-days: 14

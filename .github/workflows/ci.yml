name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Look for iPhone Duo / fold APIs and simulators
        run: ci/probe-sdk.sh

      - name: Core logic tests (fractions, scaling, converter, timers)
        run: swift test --package-path CookCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app and run UI tests on simulators
        run: ci/run-ui-tests.sh

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ci-output
          retention-days: 14

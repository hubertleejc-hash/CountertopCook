name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # iPhone Duo on iOS 27.1. Needs the xcode-27 image (Apple silicon, public preview).
  duo:
    runs-on: xcode-27
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          XCODE=/Applications/Xcode_27.1.app
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE not found on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -q "^Xcode 27\.1" || { echo "::error::Expected Xcode 27.1"; exit 1; }

      - name: Probe Xcode, iOS runtimes and iPhone Duo support
        run: |
          mkdir -p ci-output
          ci/probe-sdk.sh | tee ci-output/probe.txt

      - name: Core logic tests (fractions, scaling, converter, timers)
        run: swift test --package-path CookCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Create iPhone Duo simulator (iOS 27.1)
        run: ci/create-duo.sh

      - name: Build app and run UI tests on iPhone Duo (closed, then unfolded)
        env:
          SIMULATOR_LIST_CMD: ci/create-duo.sh
          # The preview xcode-27 runner sometimes times out XCUITest UI queries.
          UI_TEST_RETRIES: 2
          # After the closed run, open the hinge (ci/duo-hinge.sh) and rerun the layout test:
          # fully open (180 degrees), then partially open (120 degrees).
          FOLD_POSES: "open:180 partial:120"
        run: ci/run-ui-tests.sh

      # Screenshots and summaries go to a branch so they can be viewed without signing in.
      - name: Publish screenshots and summaries to ci-results-duo branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/publish-results.sh ci-results-duo

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-duo
          path: ci-output
          retention-days: 14

  # Fallback: iPhone 17 Pro + iPad Pro 13-inch on the stable image. The xcode-27 image has
  # no iPhone 17 Pro, and this job keeps working if the preview image is unavailable.
  fallback:
    runs-on: macos-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Probe Xcode, iOS runtimes and iPhone Duo support
        run: |
          mkdir -p ci-output
          ci/probe-sdk.sh | tee ci-output/probe.txt

      - name: Core logic tests (fractions, scaling, converter, timers)
        run: swift test --package-path CookCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app and run UI tests on iPhone and iPad
        run: ci/run-ui-tests.sh

      - name: Publish screenshots and summaries to ci-results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/publish-results.sh ci-results

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fallback
          path: ci-output
          retention-days: 14

# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: CountertopCook
options:
  bundleIdPrefix: com.hubertlee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CookCore:
    path: CookCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CountertopCook:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubertlee.countertopcook
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Countertop Cook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
  CountertopCookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CountertopCook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubertlee.countertopcook.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CountertopCook
schemes:
  CountertopCook:
    build:
      targets:
        CountertopCook: all
    test:
      targets:
        - CountertopCookUITests

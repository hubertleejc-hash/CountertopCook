# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: CountertopCook
options:
  bundleIdPrefix: com.hubertlee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CookCore:
    path: CookCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CountertopCook:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CookCore
      # Puts Hearth in the iOS Share Sheet (YouTube, Safari, Notes…); see ShareExtension/.
      - target: HearthShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubertlee.countertopcook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hearth
        # Scan a recipe page (VisionKit's document camera).
        INFOPLIST_KEY_NSCameraUsageDescription: Hearth uses the camera to scan a recipe page and read its text.
        # Listening to a cooking video (one saved to Photos, or a YouTube video's sound) on the phone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Hearth listens to a cooking video to write out the recipe it says. This happens on your iPhone where the language allows.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        # The iPhone Duo fold APIs (UIArrangementViewController, UIHingeInteraction,
        # reserved regions) exist only in the iOS 27 SDK. Older SDKs build without them.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": "$(inherited) FOLD_APIS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": "$(inherited) FOLD_APIS"
  HearthShare:
    type: app-extension
    platform: iOS
    # PhotoText reads the text of a shared screenshot or photo, as the app's photo import does.
    sources: [ShareExtension, App/PhotoText.swift]
    dependencies:
      - package: CookCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubertlee.countertopcook.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  CountertopCookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CountertopCook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubertlee.countertopcook.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CountertopCook
schemes:
  CountertopCook:
    build:
      targets:
        CountertopCook: all
    test:
      targets:
        - CountertopCookUITests
